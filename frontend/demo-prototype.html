        } else {

          const baseRam = srv.status === "WARNING" ? 83 : 54;

    // Fungsi membuat SVG Area Chart yang mulus
    function buildSvgChart(data, strokeColor, fillId) {
      const width = 520;
      const height = 170;
      const pad = 20;
      const pts = data.map((val, idx) => {
        const x = pad + (idx / Math.max(1, data.length - 1)) * (width - pad * 2);
        const y = height - pad - (Math.min(100, Math.max(0, val)) / 100) * (height - pad * 2);
        return `${x},${y}`;
      });
      const polylinePoints = pts.join(" ");
      const areaPoints = `${pad},${height - pad} ${polylinePoints} ${width - pad},${height - pad}`;

      return `
        <svg viewBox="0 0 ${width} ${height}" class="w-full h-48 overflow-visible">
          <defs>
            <linearGradient id="${fillId}" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0%" stop-color="${strokeColor}" stop-opacity="0.38"/>
              <stop offset="100%" stop-color="${strokeColor}" stop-opacity="0.0"/>
            </linearGradient>
          </defs>
          <!-- Grid lines -->
          <line x1="${pad}" y1="${pad}" x2="${width-pad}" y2="${pad}" stroke="#1e293b" stroke-dasharray="3 3" />
          <line x1="${pad}" y1="${height/2}" x2="${width-pad}" y2="${height/2}" stroke="#1e293b" stroke-dasharray="3 3" />
          <line x1="${pad}" y1="${height-pad}" x2="${width-pad}" y2="${height-pad}" stroke="#1e293b" />
          <text x="0" y="${pad+4}" fill="#64748b" font-size="10">100%</text>
          <text x="0" y="${height/2+4}" fill="#64748b" font-size="10">50%</text>
          <text x="4" y="${height-pad+4}" fill="#64748b" font-size="10">0%</text>

          <polygon points="${areaPoints}" fill="url(#${fillId})" />
          <polyline fill="none" stroke="${strokeColor}" stroke-width="2.5" points="${polylinePoints}" />
        </svg>
      `;
    }

    async function fetchServersFromBackend() {
      if (!state.token) return;
      try {
        const res = await fetch(API_BASE + '/servers', {
          headers: { 'Authorization': 'Bearer ' + state.token }
        });
        if (!res.ok) return;
        const list = await res.json();

        // Fetch metrik terbaru & riwayat alert dari backend
        const serversWithMetrics = await Promise.all(list.map(async s => {
          let cpu = 0;
          let ram = 0;
          let cores = 4;
          let ramTotalGb = 8.0;

          try {
            const mRes = await fetch(`${API_BASE}/metrics/${s.id}/latest`, {
              headers: { 'Authorization': 'Bearer ' + state.token }
            });
            if (mRes.ok) {
              const m = await mRes.json();
              cpu = m.cpu_percent || 0;
              ram = m.ram_percent || 0;
              cores = m.cpu_cores || 4;
              if (m.ram_total_bytes) {
                ramTotalGb = Number((m.ram_total_bytes / (1024**3)).toFixed(1));
              }
            }
          } catch (_) {}

          // Cari riwayat history yang sudah ada sebelumnya di state agar grafik tetap smooth
          const existing = state.servers.find(old => old.id === s.id);
          const historyCpu = existing && existing.historyCpu ? [...existing.historyCpu.slice(1), cpu] : Array(12).fill(cpu);
          const historyRam = existing && existing.historyRam ? [...existing.historyRam.slice(1), ram] : Array(12).fill(ram);

          return {
            id: s.id,
            name: s.name,
            ip_address: s.ip_address,
            api_key: s.api_key || '',
            status: s.status || 'OFFLINE',
            cores: cores,
            ramTotalGb: ramTotalGb,
            cpu: cpu,
            ram: ram,
            last_seen_at: s.last_seen_at || new Date().toISOString(),
            historyCpu: historyCpu,
            historyRam: historyRam
          };
        }));

        state.servers = serversWithMetrics;

        // Fetch Alert Logs nyata dari Backend
        try {
          const aRes = await fetch(`${API_BASE}/alerts/logs?limit=20`, {
            headers: { 'Authorization': 'Bearer ' + state.token }
          });
          if (aRes.ok) {
            const logs = await aRes.json();
            if (logs && logs.length > 0) {
              state.alerts = logs.map(a => ({
                id: a.id,
                server_id: a.server_id,
                alert_type: a.alert_type,
                severity: a.severity,
                message: a.message,
                triggered_at: new Date(a.triggered_at).toLocaleTimeString('id-ID')
              }));
            }
          }
        } catch (_) {}

      } catch(e) { console.error('fetchServers error:', e); }
    }

          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ username: u, password: p })
        });
        if (res.ok) {
          const data = await res.json();
          state.token = data.access_token;
          state.user = data.user || { username: u, role: "admin" };
          state.mode = "live";
          state.view = "dashboard";
          state.loginError = "";
          localStorage.setItem("np_token", state.token);
          localStorage.setItem("np_user", JSON.stringify(state.user));
          await fetchServersFromBackend();
          render();
          return;
        }
      } catch (_) {}

      // Validasi akun default admin / admin123
      if (u === "admin" && p === "admin123") {
        state.user = { username: "admin", role: "admin" };
        state.mode = "demo";
        state.view = "dashboard";
        state.loginError = "";
        render();
      } else {
        state.loginError = "Username atau Password salah! Gunakan akun: admin / admin123";
        render();
      }
    }

            parse_mode: "Markdown"

    function triggerSimulation(serverId, status) {
      const srv = state.servers.find(s => s.id === serverId);
      if (!srv) return;
      srv.status = status;
      const nowStr = new Date().toLocaleTimeString("id-ID");

      if (status === "WARNING") {
        srv.cpu = 92.4;
        srv.ram = 86.1;
        const msg = `🔥 [ALERT] HIGH CPU USAGE — Server ${srv.name} (${srv.ip_address}) melonjak ke 92.4% (Batas: 85%). Notifikasi dikirim ke Telegram Bot!`;
        state.alerts.unshift({
          id: Date.now(),
          server_id: srv.id,
          alert_type: "HIGH_CPU",
          severity: "WARNING",
          message: msg,
          triggered_at: nowStr
        });
        state.simBanner = `Simulasi Lonjakan CPU (>85%) diaktifkan! Notifikasi dikirim ke Telegram Bot.`;
        sendTelegramNotification(
          `🔥 *[ALERT] HIGH CPU USAGE*\n\n` +
          `• *Server:* \`${srv.name}\`\n` +
          `• *IP:* \`${srv.ip_address}\`\n` +
          `• *CPU Usage:* \`92.4%\` (Batas: 85%)\n` +
          `• *RAM Usage:* \`86.1%\`\n` +
          `• *Waktu:* \`${nowStr} WIB\``
        );
      } else if (status === "OFFLINE") {
        srv.cpu = 0;
        srv.ram = 0;
        const msg = `🚨 [ALERT] SERVER DOWN — Server ${srv.name} (${srv.ip_address}) berhenti mengirim heartbeat > 30 detik (Deadman's Switch). Notifikasi dikirim ke Telegram Bot!`;
        state.alerts.unshift({
          id: Date.now(),
          server_id: srv.id,
          alert_type: "SERVER_DOWN",
          severity: "CRITICAL",
          message: msg,
          triggered_at: nowStr
        });
        state.simBanner = `Simulasi Server Mati (Deadman's Switch) diaktifkan! Notifikasi dikirim ke Telegram Bot.`;
        sendTelegramNotification(
          `🚨 *[ALERT] SERVER DOWN*\n\n` +
          `• *Server:* \`${srv.name}\`\n` +
          `• *IP:* \`${srv.ip_address}\`\n` +
          `• *Status:* \`OFFLINE\`\n` +
          `• *Catatan:* Tidak mengirim telemetri > 30 detik (Deadman's Switch).\n` +
          `• *Waktu:* \`${nowStr} WIB\``
        );
      } else {
        srv.cpu = 26.5;
        srv.ram = 51.0;
        state.simBanner = `Server ${srv.name} kembali ke kondisi ONLINE normal.`;
        sendTelegramNotification(
          `✅ *[RECOVERY] SERVER ONLINE*\n\n` +
          `• *Server:* \`${srv.name}\` (${srv.ip_address})\n` +
          `• *Status:* Kembali normal (\`ONLINE\`)\n` +
          `• *Waktu:* \`${nowStr} WIB\``
        );
      }
      render();
      setTimeout(() => { state.simBanner = ""; render(); }, 4000);
    }

    function fallbackCopy(text) {
      if (navigator.clipboard && window.isSecureContext) {
        navigator.clipboard.writeText(text);
        return;
      }
      var ta = document.createElement('textarea');
      ta.value = text;
      ta.style.position = 'fixed';
      ta.style.left = '-9999px';
      document.body.appendChild(ta);
      ta.select();
      try { document.execCommand('copy'); } catch(e){}
      document.body.removeChild(ta);
    }

    function copyApiKey(id) {
      const srv = state.servers.find(s => s.id === id);
      if (!srv) return;
      fallbackCopy(srv.api_key);
      state.simBanner = "\u2705 Copied! X-Server-Key: " + srv.api_key;
      render();
      setTimeout(() => { state.simBanner = ""; render(); }, 4000);
    }

    async function deleteServer(id) {
      if (!confirm("Apakah Anda yakin ingin menghapus server ini?")) return;

      if (state.mode === "live" && state.token) {
        try {
          const res = await fetch(`${API_BASE}/servers/${id}`, {
            method: "DELETE",
            headers: { "Authorization": "Bearer " + state.token }
          });
          if (res.ok) {
            state.servers = state.servers.filter(s => s.id !== id);
            state.simBanner = "✅ Server berhasil dihapus dari sistem.";
            render();
            setTimeout(() => { state.simBanner = ""; render(); }, 3000);
            return;
          }
        } catch (e) {
          console.error("Gagal menghapus server:", e);
        }
      }

      state.servers = state.servers.filter(s => s.id !== id);
      render();
    }

            <div class="flex flex-col justify-between gap-4 sm:flex-row sm:items-center">
              <div>
                <h1 class="text-2xl font-bold text-white">Cloud Server Fleet Overview</h1>
                <p class="mt-1 text-sm text-slate-400">Pemantauan metrik CPU, RAM, dan status Heartbeat secara real-time (Interval 10 detik)</p>
              </div>
              <button onclick="state.isAddModalOpen=true; state.newlyCreatedServer=null; render();"
                class="rounded-xl bg-emerald-500 px-4 py-2.5 text-xs font-semibold text-slate-950 hover:bg-emerald-400 transition">
                + Tambah Server / VM Baru
              </button>
            </div>

            <!-- 4 Summary Cards -->
            <div class="mt-6 grid grid-cols-1 gap-4 sm:grid-cols-2 lg:grid-cols-4">
              <div class="rounded-2xl border border-slate-800 bg-slate-900/60 p-5">
                <div class="text-xs uppercase text-slate-400">Total Server</div>
                <div class="mt-2 text-3xl font-bold text-white">${state.servers.length}</div>
                <div class="mt-1 text-xs text-slate-500">Node terdaftar di TimescaleDB</div>
              </div>
              <div class="rounded-2xl border border-emerald-500/30 bg-emerald-500/5 p-5">
                <div class="text-xs uppercase text-emerald-300">Server Online</div>
                <div class="mt-2 text-3xl font-bold text-emerald-400">${onlineCount}</div>
                <div class="mt-1 text-xs text-emerald-300/70">Heartbeat aktif &lt; 30 detik</div>
              </div>
              <div class="rounded-2xl border border-amber-500/30 bg-amber-500/5 p-5">
                <div class="text-xs uppercase text-amber-300">High Load (Warning)</div>
                <div class="mt-2 text-3xl font-bold text-amber-400">${warningCount}</div>
                <div class="mt-1 text-xs text-amber-300/70">CPU &gt; 85% atau RAM &gt; 90%</div>
              </div>
              <div class="rounded-2xl border border-rose-500/30 bg-rose-500/5 p-5">
                <div class="text-xs uppercase text-rose-300">Server Offline</div>
                <div class="mt-2 text-3xl font-bold text-rose-400">${offlineCount}</div>
                <div class="mt-1 text-xs text-rose-300/70">Deadman's Switch terpicu</div>
              </div>
            </div>

            <!-- Server Cards -->
            <h2 class="mt-8 text-lg font-semibold text-white">Daftar Target Server & VM (Klik untuk Detail Grafik & Simulasi)</h2>
            <div class="mt-4 grid grid-cols-1 gap-4 md:grid-cols-2 lg:grid-cols-3">
              ${state.servers.map(srv => {
                const badgeClass = srv.status === "ONLINE"
                  ? "border-emerald-500/40 bg-emerald-500/15 text-emerald-300"
                  : srv.status === "WARNING"
                  ? "border-amber-500/40 bg-amber-500/15 text-amber-300"
                  : "border-rose-500/40 bg-rose-500/15 text-rose-300";

                const cpuBar = srv.cpu >= 85 ? "bg-rose-500" : srv.cpu >= 70 ? "bg-amber-400" : "bg-sky-400";
                const ramBar = srv.ram >= 90 ? "bg-rose-500" : srv.ram >= 75 ? "bg-amber-400" : "bg-purple-400";

                return `
                  <div class="rounded-2xl border border-slate-800 bg-slate-900/70 p-5 hover:border-emerald-500/50 transition flex flex-col justify-between">
                    <div>
                      <div class="flex items-start justify-between">
                        <div>
                          <button onclick="openServerDetail('${srv.id}')" class="text-left text-base font-bold text-white hover:text-emerald-400">
                            ${srv.name} ↗
                          </button>
                          <div class="font-mono text-xs text-slate-400">IP: ${srv.ip_address}</div>
                        </div>
                        <span class="rounded-full border px-2.5 py-0.5 text-[11px] font-bold ${badgeClass}">
                          ● ${srv.status}
                        </span>
                      </div>

                      <div class="mt-5 space-y-3">
                        <div>
                          <div class="flex justify-between text-xs">
                            <span class="text-slate-400">CPU Usage (${srv.cores} Cores)</span>
                            <span class="font-mono font-bold text-white">${srv.cpu.toFixed(1)}%</span>
                          </div>
                          <div class="mt-1.5 h-2 w-full rounded-full bg-slate-800 overflow-hidden">
                            <div class="h-full ${cpuBar} transition-all duration-500" style="width:${Math.min(100, srv.cpu)}%"></div>
                          </div>
                        </div>

                        <div>
                          <div class="flex justify-between text-xs">
                            <span class="text-slate-400">RAM Usage (${srv.ramTotalGb} GB)</span>
                            <span class="font-mono font-bold text-white">${srv.ram.toFixed(1)}%</span>
                          </div>
                          <div class="mt-1.5 h-2 w-full rounded-full bg-slate-800 overflow-hidden">
                            <div class="h-full ${ramBar} transition-all duration-500" style="width:${Math.min(100, srv.ram)}%"></div>
                          </div>
                        </div>
                      </div>
                    </div>

                    <div class="mt-5 flex items-center justify-between border-t border-slate-800 pt-3 text-xs text-slate-400">
                      <span>Heartbeat: ${new Date(srv.last_seen_at).toLocaleTimeString("id-ID")}</span>
                      <div class="flex gap-2">
                        <button onclick="copyApiKey('${srv.id}')" class="rounded-lg bg-slate-800 px-2.5 py-1 font-medium text-amber-400 hover:bg-slate-700" title="${srv.api_key}">
                          Salin Key
                        </button>
                        <button onclick="openServerDetail('${srv.id}')" class="rounded-lg bg-slate-800 px-2.5 py-1 font-medium text-emerald-400 hover:bg-slate-700">
                          Buka Grafik & Simulasi
                        </button>
                        <button onclick="deleteServer('${srv.id}')" class="rounded-lg px-2 py-1 text-rose-400 hover:bg-rose-500/15">
                          Hapus
                        </button>
                      </div>
                    </div>
                  </div>
                `;
              }).join("")}
            </div>

            <!-- Tabel Alert Logs -->
            <h2 class="mt-10 text-lg font-semibold text-white">🔔 Riwayat Peringatan Otomatis (Telegram & Discord Alert Logs)</h2>
            <div class="mt-4 overflow-hidden rounded-2xl border border-slate-800 bg-slate-900/60">
              <table class="w-full text-left text-xs">
                <thead class="border-b border-slate-800 bg-slate-900 uppercase text-slate-400">
                  <tr>
                    <th class="px-4 py-3">Waktu</th>
                    <th class="px-4 py-3">Tipe Alert</th>
                    <th class="px-4 py-3">Severity</th>
                    <th class="px-4 py-3">Pesan Notifikasi (Telegram Bot)</th>
                  </tr>
                </thead>
                <tbody class="divide-y divide-slate-800">
                  ${state.alerts.map(a => `
                    <tr>
                      <td class="px-4 py-3 font-mono text-slate-400">${a.triggered_at}</td>
                      <td class="px-4 py-3 font-bold text-white">${a.alert_type}</td>
                      <td class="px-4 py-3">
                        <span class="rounded-full px-2.5 py-0.5 text-[10px] font-bold ${a.severity === 'CRITICAL' ? 'bg-rose-500/20 text-rose-300' : 'bg-amber-500/20 text-amber-300'}">
                          ${a.severity}
                        </span>
                      </td>
                      <td class="px-4 py-3 text-slate-300">${a.message}</td>
                    </tr>
                  `).join("")}
                </tbody>
              </table>
            </div>
          </div>

          <!-- Modal Tambah Server -->
          ${state.isAddModalOpen ? `
            <div class="fixed inset-0 z-50 flex items-center justify-center bg-black/75 p-4">
              <div class="w-full max-w-lg rounded-2xl border border-slate-800 bg-slate-900 p-6">
                <div class="flex items-center justify-between border-b border-slate-800 pb-3">
                  <h3 class="text-base font-bold text-white">Daftarkan Server / VM Baru</h3>
                  <button onclick="state.isAddModalOpen=false; render();" class="text-slate-400 hover:text-white">✕</button>
                </div>
                ${!state.newlyCreatedServer ? `
                  <form onsubmit="handleAddServer(event)" class="mt-4 space-y-4">
                    <div>
                      <label class="block text-xs text-slate-300">Nama Server / VM Target</label>
                      <input id="new-srv-name" type="text" required placeholder="Contoh: VM-Ubuntu-Kelompok-01"
                        class="mt-1 block w-full rounded-xl border border-slate-700 bg-slate-950 px-3.5 py-2 text-sm text-white" />
                    </div>
                    <div>
                      <label class="block text-xs text-slate-300">IP Address Server</label>
                      <input id="new-srv-ip" type="text" required placeholder="Contoh: 192.168.1.50"
                        class="mt-1 block w-full rounded-xl border border-slate-700 bg-slate-950 px-3.5 py-2 text-sm text-white" />
                    </div>
                    <div class="flex justify-end gap-2 pt-2">
                      <button type="button" onclick="state.isAddModalOpen=false; render();" class="rounded-xl border border-slate-700 px-4 py-2 text-xs text-slate-300">Batal</button>
                      <button type="submit" class="rounded-xl bg-emerald-500 px-4 py-2 text-xs font-semibold text-slate-950">Generate X-Server-Key</button>
                    </div>
                  </form>
                ` : `
                  <div class="mt-4 space-y-4">
                    <div class="rounded-xl border border-emerald-500/30 bg-emerald-500/10 p-3 text-xs text-emerald-200">
                      Server <strong>${state.newlyCreatedServer.name}</strong> berhasil dibuat! Masukkan <code>X-Server-Key</code> berikut ke <code>agent/config.json</code>:
                    </div>
                    <div class="rounded-xl border border-slate-700 bg-slate-950 p-3 font-mono text-xs text-emerald-400 break-all select-all cursor-pointer" onclick="fallbackCopy(state.newlyCreatedServer.api_key); state.simBanner='\u2705 API Key disalin!'; render();" title="Klik untuk menyalin">
                      ${state.newlyCreatedServer.api_key}
                    </div>
                    <div class="flex justify-end gap-2">
                      <button onclick="fallbackCopy(state.newlyCreatedServer.api_key); state.simBanner='\u2705 API Key disalin!'; render();" class="rounded-xl border border-emerald-500/30 bg-emerald-500/15 px-4 py-2 text-xs font-semibold text-emerald-300">📋 Salin Key</button>
                      <button onclick="state.isAddModalOpen=false; render();" class="rounded-xl bg-emerald-500 px-5 py-2 text-xs font-semibold text-slate-950">Selesai</button>
                    </div>
                  </div>
                `}
              </div>
            </div>
          ` : ""}
        `;
        return;
      }

      // DETAIL VIEW
      const srv = state.servers.find(s => s.id === state.selectedServerId) || state.servers[0];
      const usedGb = ((srv.ram / 100) * srv.ramTotalGb).toFixed(2);
      const srvAlerts = state.alerts.filter(a => a.server_id === srv.id);

      root.innerHTML = `
        ${navbarHtml}
        <div class="mx-auto max-w-7xl px-4 py-8 sm:px-6 lg:px-8">
          <div class="flex flex-col justify-between gap-4 sm:flex-row sm:items-center">
            <div>
              <button onclick="state.view='dashboard'; render();" class="text-xs font-medium text-emerald-400 hover:underline">
                ← Kembali ke Daftar Server
              </button>
              <div class="mt-2 flex items-center gap-3">
                <h1 class="text-2xl font-bold text-white">${srv.name}</h1>
                <span class="rounded bg-slate-900 border border-slate-800 px-2.5 py-0.5 font-mono text-xs text-slate-300">${srv.ip_address}</span>
                <span class="rounded-full px-3 py-0.5 text-xs font-bold ${
                  srv.status === 'ONLINE' ? 'bg-emerald-500/20 text-emerald-300' : srv.status === 'WARNING' ? 'bg-amber-500/20 text-amber-300' : 'bg-rose-500/20 text-rose-300'
                }">● ${srv.status}</span>
              </div>
            </div>

            <!-- Tombol Simulasi Demo Dosen -->
            <div class="flex flex-wrap items-center gap-2 rounded-2xl border border-slate-800 bg-slate-900 p-2.5">
              <span class="px-2 text-[11px] font-bold uppercase text-slate-400">Simulasi Demo Dosen:</span>
              <button onclick="triggerSimulation('${srv.id}', 'ONLINE')"
                class="rounded-xl bg-emerald-500/15 border border-emerald-500/30 px-3 py-1.5 text-xs font-medium text-emerald-300 hover:bg-emerald-500/25">
                ✓ Normal (ONLINE)
              </button>
              <button onclick="triggerSimulation('${srv.id}', 'WARNING')"
                class="rounded-xl bg-amber-500/15 border border-amber-500/30 px-3 py-1.5 text-xs font-medium text-amber-300 hover:bg-amber-500/25">
                🔥 Overload CPU (&gt;85%)
              </button>
              <button onclick="triggerSimulation('${srv.id}', 'OFFLINE')"
                class="rounded-xl bg-rose-500/15 border border-rose-500/30 px-3 py-1.5 text-xs font-medium text-rose-300 hover:bg-rose-500/25">
                ⚠️ Matikan Server (OFFLINE)
              </button>
            </div>
          </div>

          ${state.simBanner ? `
            <div class="mt-4 rounded-xl border border-emerald-500/40 bg-emerald-500/10 px-4 py-2.5 text-xs font-medium text-emerald-300">
              ${state.simBanner}
            </div>
          ` : ""}

          <!-- 3 Kartu Metrik Detail -->
          <div class="mt-6 grid grid-cols-1 gap-4 sm:grid-cols-3">
            <div class="rounded-2xl border border-slate-800 bg-slate-900/60 p-5">
              <div class="text-xs text-slate-400">REAL-TIME CPU LOAD</div>
              <div class="mt-2 font-mono text-3xl font-bold text-sky-400">${srv.cpu.toFixed(1)}%</div>
              <div class="mt-1 text-xs text-slate-400">Cores: ${srv.cores} vCPU (Threshold Alert: 85%)</div>
            </div>
            <div class="rounded-2xl border border-slate-800 bg-slate-900/60 p-5">
              <div class="text-xs text-slate-400">REAL-TIME MEMORY (RAM)</div>
              <div class="mt-2 font-mono text-3xl font-bold text-purple-400">${srv.ram.toFixed(1)}%</div>
              <div class="mt-1 text-xs text-slate-400">Terpakai: ${usedGb} GB / ${srv.ramTotalGb} GB (Threshold: 90%)</div>
            </div>
            <div class="rounded-2xl border border-slate-800 bg-slate-900/60 p-5">
              <div class="text-xs text-slate-400">X-SERVER-KEY (AGENT TOKEN)</div>
              <div class="mt-2 truncate rounded-lg border border-slate-800 bg-slate-950 px-3 py-1.5 font-mono text-xs text-emerald-400">${srv.api_key}</div>
              <div class="mt-2 text-xs text-slate-400">Last Heartbeat: ${new Date(srv.last_seen_at).toLocaleTimeString("id-ID")}</div>
            </div>
          </div>

          <!-- 2 Grafik Real-Time -->
          <div class="mt-6 grid grid-cols-1 gap-6 lg:grid-cols-2">
            <div class="rounded-2xl border border-slate-800 bg-slate-900/60 p-5">
              <div class="mb-3 flex items-center justify-between">
                <h3 class="text-sm font-bold text-white">📈 Tren Penggunaan CPU (%) — TimescaleDB</h3>
                <span class="font-mono text-xs text-sky-400">${srv.cpu.toFixed(1)}%</span>
              </div>
              ${buildSvgChart(srv.historyCpu, "#38bdf8", "cpuGradSvg")}
            </div>

            <div class="rounded-2xl border border-slate-800 bg-slate-900/60 p-5">
              <div class="mb-3 flex items-center justify-between">
                <h3 class="text-sm font-bold text-white">📊 Tren Penggunaan RAM (%) — TimescaleDB</h3>
                <span class="font-mono text-xs text-purple-400">${srv.ram.toFixed(1)}%</span>
              </div>
              ${buildSvgChart(srv.historyRam, "#c084fc", "ramGradSvg")}
            </div>
          </div>

          <!-- Log Alert Server -->
          <h3 class="mt-8 text-base font-bold text-white">🔔 Riwayat Alert pada ${srv.name}</h3>
          <div class="mt-3 overflow-hidden rounded-2xl border border-slate-800 bg-slate-900/60">
            ${srvAlerts.length === 0 ? `
              <div class="p-6 text-center text-xs text-slate-400">Belum ada insiden pada server ini. Klik tombol "Overload CPU" atau "Matikan Server" di atas untuk mendemokan alert!</div>
            ` : `
              <table class="w-full text-left text-xs">
                <thead class="border-b border-slate-800 bg-slate-900 uppercase text-slate-400">
                  <tr>
                    <th class="px-4 py-3">Waktu</th>
                    <th class="px-4 py-3">Tipe</th>
                    <th class="px-4 py-3">Severity</th>
                    <th class="px-4 py-3">Pesan Alert</th>
                  </tr>
                </thead>
                <tbody class="divide-y divide-slate-800">
                  ${srvAlerts.map(a => `
                    <tr>
                      <td class="px-4 py-3 font-mono text-slate-400">${a.triggered_at}</td>
                      <td class="px-4 py-3 font-bold text-white">${a.alert_type}</td>
                      <td class="px-4 py-3"><span class="rounded-full px-2 py-0.5 text-[10px] font-bold ${a.severity === 'CRITICAL' ? 'bg-rose-500/20 text-rose-300' : 'bg-amber-500/20 text-amber-300'}">${a.severity}</span></td>
                      <td class="px-4 py-3 text-slate-300">${a.message}</td>
                    </tr>
                  `).join("")}
                </tbody>
              </table>
            `}
          </div>
        </div>
      `;
    }

    // Jika sudah ada session login tersimpan di browser, langsung fetch server terbaru
    if (state.token) {
      fetchServersFromBackend().then(() => render());
    } else {
      render();
    }
  </script>
</body>
</html>
